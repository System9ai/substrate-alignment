name: Docs

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Least privilege: build reads the repo; deploy publishes to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment at a time; do not cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install docs toolchain
        # mkdocstrings imports the package, so install it too.
        run: pip install -e "./python[docs]"

      - name: Build
        # mkdocs.yml lives at the repository root (docs_dir: .).
        # --strict promotes MkDocs warnings (broken cross-links, missing nav
        # targets) to build failures, so documentation link rot is caught here
        # rather than shipped to the published site.
        run: mkdocs build --strict --site-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    # Pages is enabled for this repository (Settings > Pages > Source: "GitHub
    # Actions"), so a failed deploy is a real failure and must fail the run.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
